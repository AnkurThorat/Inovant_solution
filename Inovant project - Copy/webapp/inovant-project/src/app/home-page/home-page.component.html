  <!-- Main Content -->
  <main class="main-content">
    <!-- Top Profile Card -->
    <div class="profile-card">
      <img
        src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
        alt="User"
        class="profile-pic"
      />
      <div class="user-info">
        <h3>Test Test</h3>
        <p>testyopmail.com</p>
        <p>+965 9653214</p>
      </div>
    </div>

    <!-- Personal Information Form -->
    <section class="personal-info">
      <h2>PERSONAL INFORMATION</h2>
      <form (ngSubmit)="onSubmit()" #infoForm="ngForm">
        <div class="form-grid">
          <div class="form-group">
            <label>First Name</label>
            <input
              type="text"
              name="first_name"
              required
              [(ngModel)]="user.first_name"
            />
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input
              type="text"
              name="last_name"
              required
              [(ngModel)]="user.last_name"
            />
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input
              type="email"
              name="email"
              required
              [(ngModel)]="user.email"
            />
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input
              type="text"
              name="phone"
              required
              [(ngModel)]="user.phone_number"
            />
          </div>
          <div class="form-group">
            <label>Old Password</label>
            <input type="password" name="oldPassword" ngModel />
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" name="newPassword" ngModel />
          </div>
          <div class="form-group full-width">
            <label>Confirm New Password</label>
            <input type="password" name="confirmNewPassword" ngModel />
          </div>
        </div>

        <button type="submit" [disabled]="!infoForm.valid" class="save-btn">
          Save
        </button>
      </form>
    </section>
  </main>
</div>
